<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HNL Remote Terminal 06</title>
<style>
:root{--green:#a9ffb0;--dim:#62a96a;--red:#e64040;--deep:#170203;--bg:#020403}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--green);font-family:"Courier New",monospace}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;overflow-x:hidden;background:radial-gradient(circle at 50% 30%,#101a11 0,#030604 48%,#090101 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0,rgba(255,255,255,.025) 1px,transparent 1px,transparent 4px);mix-blend-mode:screen;z-index:5}
body:after{content:"";position:fixed;inset:-20%;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.82) 76%);z-index:4}
.vines{position:fixed;inset:0;overflow:hidden;pointer-events:none;opacity:.55}.vine{position:absolute;height:140%;width:3px;background:linear-gradient(#250506,#641012,#160304);box-shadow:0 0 9px #4d090b;transform-origin:top}.v1{left:8%;top:-15%;transform:rotate(-13deg)}.v2{right:11%;top:-12%;transform:rotate(16deg)}.v3{right:27%;top:60%;height:60%;transform:rotate(61deg)}
.spores{position:fixed;inset:0;pointer-events:none;overflow:hidden}.spore{position:absolute;width:3px;height:3px;border-radius:50%;background:#dce6dc;opacity:.28;animation:float 9s linear infinite}.spore:nth-child(1){left:12%;top:90%;animation-delay:-2s}.spore:nth-child(2){left:31%;top:75%;animation-delay:-6s}.spore:nth-child(3){left:68%;top:88%;animation-delay:-4s}.spore:nth-child(4){left:85%;top:65%;animation-delay:-8s}.spore:nth-child(5){left:51%;top:95%;animation-delay:-1s}
.terminal{width:min(760px,100%);border:1px solid #39653e;padding:18px;box-shadow:0 0 28px rgba(90,255,110,.09),0 0 55px rgba(160,0,0,.08),inset 0 0 35px rgba(0,0,0,.8);position:relative;z-index:2;background:rgba(1,7,3,.88)}
.badge{text-align:center;color:var(--red);font-weight:bold;letter-spacing:.32em;font-size:11px;margin-bottom:8px;text-shadow:0 0 8px rgba(255,0,0,.35)}
.header{border-top:1px solid #592224;border-bottom:1px dashed #39653e;padding:12px 0;margin-bottom:16px;text-align:center;letter-spacing:.08em}.header b{display:block;font-size:clamp(16px,4.5vw,24px)}.header span{font-size:12px;color:var(--dim)}
#screen{font-size:clamp(13px,3.8vw,18px);line-height:1.55;min-height:430px;white-space:pre-wrap}.line{opacity:0;animation:show .12s forwards}.warning{color:#ff6666;font-weight:bold;text-shadow:0 0 6px rgba(255,40,40,.35)}.packet{color:#c9ffd0;font-weight:bold;margin-top:4px}.sequence{font-size:clamp(20px,6vw,32px);letter-spacing:.12em;line-height:1.75;color:#f0fff1;text-shadow:0 0 7px rgba(150,255,160,.45);white-space:nowrap}.upsidedown{color:#bb4b4b;font-size:11px;letter-spacing:.18em;text-align:right;margin-top:10px;opacity:.7}
.cursor{display:inline-block;width:.65em;height:1em;background:var(--green);vertical-align:-.15em;animation:blink .8s steps(1) infinite}.footer{border-top:1px dashed #39653e;margin-top:12px;padding-top:9px;color:var(--dim);font-size:11px;text-align:center}
.glitch{animation:glitch .18s linear 2}@keyframes show{to{opacity:1}}@keyframes blink{50%{opacity:0}}@keyframes glitch{0%{transform:translateX(0)}25%{transform:translateX(-2px)}50%{transform:translateX(3px)}75%{transform:translateX(-1px)}100%{transform:translateX(0)}}@keyframes float{from{transform:translateY(0) translateX(0);opacity:0}20%{opacity:.35}to{transform:translateY(-110vh) translateX(35px);opacity:0}}
</style>
</head>
<body>
<div class="vines"><i class="vine v1"></i><i class="vine v2"></i><i class="vine v3"></i></div>
<div class="spores"><i class="spore"></i><i class="spore"></i><i class="spore"></i><i class="spore"></i><i class="spore"></i></div>
<main class="terminal" id="terminal">
<div class="badge">CLASSIFIED // HAWKINS, INDIANA</div>
<div class="header"><b>HAWKINS NATIONAL LABORATORY</b><span>REMOTE ACCESS SYSTEM // TERMINAL 06</span></div>
<div id="screen"></div>
<div class="upsidedown">DIMENSIONAL INTERFERENCE // GATE ACTIVE</div>
<div class="footer">RESTRICTED SYSTEM · AUTHORIZED PERSONNEL ONLY</div>
</main>
<script>
const lines=[
 ['> ESTABLISHING REMOTE CONNECTION...',650,''],
 ['> SEARCHING NODE D-011...',950,''],
 ['> NODE D-011 LOCATED',700,''],
 ['> CONNECTION ESTABLISHED',650,''],
 ['',220,''],
 ['WARNING: DIMENSIONAL BREACH DETECTED',850,'warning'],
 ['GATE STATUS: ACTIVE',500,'warning'],
 ['SIGNAL INTEGRITY: 41%',550,''],
 ['',220,''],
 ['> RECOVERING TRANSMISSION...',900,''],
 ['> TWO DATA PACKETS RECOVERED',600,''],
 ['',220,''],
 ['TRANSMISSION A',400,'packet'],
 ['▲   █   ●   ◆   █   ▲   ◆',650,'sequence'],
 ['TRANSMISSION B',400,'packet'],
 ['▲   ●   ●   █   █   ◆   ◆',700,'sequence'],
 ['',280,''],
 ['SIGNAL CORRUPTION DETECTED',650,'warning'],
 ['> ACCESS KEY REQUIRED',600,'warning'],
 ['> CONSULT PHYSICAL DECODING KEY',500,''],
 ['',200,''],
 ['CONNECTION UNSTABLE ',0,'cursor']
];
const s=document.getElementById('screen'),term=document.getElementById('terminal');let i=0;
function next(){if(i>=lines.length)return;const [txt,delay,cls]=lines[i++];const d=document.createElement('div');d.className='line '+(cls==='cursor'?'':cls);if(cls==='cursor'){d.textContent=txt;const c=document.createElement('span');c.className='cursor';d.appendChild(c)}else d.textContent=txt;s.appendChild(d);if(Math.random()<.22){term.classList.add('glitch');setTimeout(()=>term.classList.remove('glitch'),400)}setTimeout(next,delay)}
setTimeout(next,400);
</script>
</body>
</html>
